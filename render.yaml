services:
  - type: web
    name: live-stock-dashboard-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/market-status
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_ENABLED
        value: "false"
      - key: POSTGRES_ENABLED
        value: "false"
